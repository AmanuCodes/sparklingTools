<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sparkling Tools</title>
  <link rel="stylesheet" href="../assets/css/pre.css">
</head>
<body>
  <header>
    <div>
      <div class="brandn">Sparkling Tools</div>
      <p class="brandi">We provide different tools for your needs.</p>
    </div>
    <h1>Gallery 🖼️ </h1>
    <nav>
      <ul class="vnav">
        <li><a class="btn" href="../index.html">Home</a></li>
        <li><a class="btn" href="./counter.html">Counter</a></li>
        <li><a class="btn"href="./todo.html">Sparkling Tasks</a></li>
      </ul>
    </nav>
    
    <div class="flexrcc">
      <div class="invitation">
        <p>You can start using our Image poster tool for free.</>
        <div>
          <a class="btn" href="#gallery">Gallery &darr;</a>
        </div>
      </div>
    </div>

  </header>
  <main>
    <section id="gallery">
      <h2 class="mt5vh">Gallery</h2>
      <p>Gallery of Social media logos</p>
      <div>
        <figure>
          <img id="galbox" src="../assets/images/github.png" alt="Github logo">
          <figcaption>Github</figcaption>
        </figure>
      </div>
      <div class="flexra">
        <form>
          <select id="choice">
            <option value="github">Github</option>
            <option value="google">Google</option>
            <option value="linkedin">LinkedIn</option>
            <option value="facebook">Facebook</option>
            <option value="youtube">YouTube</option>
          </select>
          <button id="poster" type="submit">Show</button>
        </form>
      </div>
      
      <div id="imgsBox" class="flexra">
        <img src="../assets/images/github.png" alt="Github logo">
        <img src="../assets/images/google.png" alt="Google logo">
        <img src="../assets/images/linkedin.png" alt="Linkedin logo">
        <img src="../assets/images/facebook.png" alt="Facebook logo">
        <img src="../assets/images/youtube.png" alt="Youtube logo">
      </div>
    </section>
  </main>
  <footer>
    <div>
      2026 &copy;
    </div>
    <div>
      Sparkling Tools
    </div>
    <div>
      Amanuel
    </div>
  </footer>
  <script src="../assets/js/gallery.js"></script>
</body>
</html>
