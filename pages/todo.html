<!DOCTYPE html>
<html>
  
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="An optimized minimalist to do list for your tasks from sparkling solutions">
  <title>Sparkling Tasks</title>
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/todo.css">
  <script src="../assets/js/todo.js" defer></script>
</head>

<body>
  
  <header>
    
    <div class="top-bar">
      
      <button class="menu-btn" id="menu-btn">
        <span></span>
        <span></span>
        <span></span>
      </button>
      
      <div class="hero">
        <img class="logo-img" src="../assets/logos/sparkTools0.png" alt="Sparkling Tools Logo">
        <a class="logo-text" href="../index.html">Sparkling Tools</a>
      </div>
      
    </div>
    
    <nav>
      <div>
        
      </div>
      <div>
        
      </div>
    </nav>
    
  </header>
  
  <main>
    
    <section class="intro-page" id="intro-page">
      
      <h1>Sparkling Tasks</h1>
      <p>Elevate your productivity with Sparkling Solution's Sparkling Tasks.</p>
      
    </section>
    
    <section class="todo-page" id="todo-page">
      <h2>To Do List</h2>
      <div class="todo-stack">
        
        <div class="pre-display-box">
          
          <div class="add-box">
            
          </div>
          
          <div class="control-box">
            
            <div class="filter-box">
              <button class="filter-btn">
                <img src="../assets/icons/filter.png" alt="">
              </button>
            </div>
            
            <div class="filterer-box">
              
              <form class="filter-form" id="filter-form">
                
                <fieldset>
                  
                  <legend>Filter By State</legend>
                  
                  <div>
                    <ul class="filter-list">
                      <li onclick= "filterWith('all')">All</li>
                      <li onclick= "filterWith('active')">Active</li>
                      <li onclick= "filterWith('done')">Done</li>
                    </ul>
                  </div>
                  
                </fieldset>
                 
                <div>
                  <input 
                  type="image" 
                  class="submit-filter" 
                  id="submit-filter" 
                  src="../assets/icons/filter1.png"
                  >
                </div>
                
              </form>
              
            </div>
            
          </div>
          
        </div>
        
        <div class="progress-box">
          <div class="progress-count" id="progress-count"></div>
        </div>
        
        <div class="display-box">
          <p class="no-task" id="no-task">You don't have an any tasks. Add tasks to use the to do list</p>
          <ul class="task-list" id="task-list"></ul>
        </div>
        
      </div>
    </section>
  </main>
  
  <footer>
    
  </footer>
  
</body>

</html>
